name: kartu-kendali

services:
  kartu-kendali:
    container_name: kartu-kendali
    image: ghcr.io/bps-kota-bontang/kartu-kendali:latest
    restart: always
    networks:
      - main_network
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=${SESSION_DRIVER}
      - CACHE_STORE=${CACHE_STORE}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - DEFAULT_USER_PASSWORD=${DEFAULT_USER_PASSWORD}

networks:
  main_network:
    external: true
